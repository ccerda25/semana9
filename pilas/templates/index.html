<!-- Cámara -->
<div class="card shadow-sm mt-4">

    <div class="card-body">

        <h5 class="card-title">
            Cámara
        </h5>

        <div class="text-center">

            <video
                id="video"
                class="img-fluid rounded mb-3"
                autoplay
                playsinline
            ></video>

            <canvas id="canvas" class="d-none"></canvas>

            <div class="d-flex justify-content-center gap-2">

                <button
                    id="iniciarCamara"
                    class="btn btn-primary"
                >
                    Activar cámara
                </button>

                <button
                    id="tomarFoto"
                    class="btn btn-success"
                    disabled
                >
                    Tomar foto
                </button>

            </div>

            <div id="mensajeCamara" class="mt-3"></div>

        </div>

    </div>

</div>
